name: Market.io Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java for Android export
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"

      - name: Set up Godot and export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true

      - name: Configure Godot Android SDK paths
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Create Android debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify Android export prerequisites
        run: |
          cat "$HOME/.config/godot/editor_settings-4.tres"
          test -d "$ANDROID_HOME/ndk/23.2.8568313"
          test -d "$ANDROID_HOME/cmake/3.10.2.4988404"
          test -s "$HOME/.android/debug.keystore"

      - name: Validate project in headless editor
        run: godot --headless --editor --editor-settings "$HOME/.config/godot/editor_settings-4.tres" --path . --quit

      - name: Export Android debug APK
        run: |
          mkdir -p build
          godot --verbose --headless --editor-settings "$HOME/.config/godot/editor_settings-4.tres" --path . --export-debug "Android" build/Market.io.apk

      - name: Verify APK exists
        run: test -s build/Market.io.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Market.io-Android-APK
          path: build/Market.io.apk
          if-no-files-found: error
          retention-days: 14
